<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FiveM Intelligence Dashboard</title>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --border: #374151;
      --text: #f9fafb;
      --muted: #9ca3af;
      --success: #86efac;
      --error: #fca5a5;
      --warning: #fde68a;
      --accent: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 34px 20px 60px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .page-header {
      margin-bottom: 24px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 0;
    }

    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .auth-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: end;
    }

    .auth-status {
      min-width: 140px;
      text-align: right;
      padding-bottom: 13px;
      font-weight: bold;
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: -4px;
      color: var(--muted);
      font-size: 14px;
    }

    .remember-row input {
      width: auto;
      margin: 0;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-button {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 9px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab-button.active {
      background: var(--accent);
      color: #111827;
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      background: var(--panel);
      color: var(--text);
      border: 1px solid #4b5563;
      border-radius: 9px;
      padding: 12px;
      margin-bottom: 14px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: white;
      color: #111827;
    }

    .secondary {
      background: #374151;
      color: white;
    }

    .copy-btn {
      padding: 5px 8px;
      font-size: 12px;
      margin-left: 6px;
      background: #374151;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .match,
    .community-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-top: 14px;
    }

    .status-box {
      margin-top: 14px;
    }

    .muted {
      color: var(--muted);
    }

    .success {
      color: var(--success);
    }

    .error {
      color: var(--error);
    }

    .warning {
      color: var(--warning);
    }

    .badge {
      display: inline-block;
      background: #374151;
      border-radius: 999px;
      padding: 5px 9px;
      margin-right: 5px;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .result-banner {
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .result-banner.match-found {
      background: #14532d;
    }

    .result-banner.no-match {
      background: #374151;
    }

    .result-banner.error-banner {
      background: #7f1d1d;
    }

    code {
      background: #0b1120;
      padding: 3px 6px;
      border-radius: 5px;
    }

    .section-title {
      margin-bottom: 16px;
    }

    .community-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .community-status {
      font-size: 13px;
      font-weight: bold;
    }

    .footer-note {
      color: var(--muted);
      font-size: 13px;
      margin-top: 12px;
    }

    @media (max-width: 700px) {
      .auth-row {
        grid-template-columns: 1fr;
      }

      .auth-status {
        text-align: left;
        padding-bottom: 0;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="page-header">
      <h1>FiveM Intelligence Dashboard</h1>
      <p class="subtitle">
        Search stored Discord community associations and manage known communities.
      </p>
    </div>

    <div class="card">
      <div class="auth-row">
        <div>
          <label for="apiKey">API Key</label>
          <input
            type="password"
            id="apiKey"
            placeholder="Enter API key"
            oninput="handleApiKeyChange()"
          />

          <label class="remember-row">
            <input
              type="checkbox"
              id="rememberApiKey"
              onchange="handleRememberChange()"
            />
            Remember on this browser
          </label>
        </div>

        <div id="authStatus" class="auth-status muted">
          Not authenticated
        </div>
      </div>
    </div>

    <div class="tabs">
      <button
        class="tab-button active"
        onclick="showTab('lookup', this)"
      >
        User Lookup
      </button>

      <button
        class="tab-button"
        onclick="showTab('communities', this)"
      >
        Manage Communities
      </button>
    </div>

    <div id="lookup" class="tab active">

      <div class="card">
        <h2 class="section-title">User Lookup</h2>

        <label for="lookupDiscordId">Discord User ID</label>

        <input
          type="text"
          id="lookupDiscordId"
          placeholder="Example: 198165163172429824"
          onkeydown="if (event.key === 'Enter') searchUser()"
        />

        <button
          class="primary"
          onclick="searchUser()"
        >
          Search
        </button>

        <div id="lookupStatus" class="status-box"></div>
      </div>

      <div id="lookupResults"></div>
    </div>

    <div id="communities" class="tab">

      <div class="card">
        <h2 class="section-title">Add Community</h2>

        <div class="grid">

          <div>
            <label for="communitySubject">
              Product / Community
            </label>

            <select id="communitySubject">
              <option value="">Select product/community</option>
            </select>
          </div>

          <div>
            <label for="communityDiscordId">
              Discord Guild ID
            </label>

            <input
              id="communityDiscordId"
              type="text"
              placeholder="Example: 1136029776080023563"
            />
          </div>

          <div>
            <label for="communityName">
              Discord Server Name
            </label>

            <input
              id="communityName"
              type="text"
              placeholder="Example: Eulen"
            />
          </div>

          <div>
            <label for="communityConfidence">
              Confidence
            </label>

            <select id="communityConfidence">
              <option>UNVERIFIED</option>
              <option>LOW</option>
              <option>MEDIUM</option>
              <option>HIGH</option>
              <option selected>CONFIRMED</option>
            </select>
          </div>

          <div>
            <label for="communityActive">
              Status
            </label>

            <select id="communityActive">
              <option value="true">Active</option>
              <option value="false">Inactive / Historical</option>
            </select>
          </div>

          <div>
            <label for="communitySourceUrl">
              Source URL
            </label>

            <input
              id="communitySourceUrl"
              type="text"
              placeholder="Optional"
            />
          </div>

        </div>

        <button
          class="primary"
          onclick="addCommunity()"
        >
          Add Community
        </button>

        <div id="communityStatus" class="status-box"></div>
      </div>

      <div class="card">
        <div class="community-top">
          <div>
            <h2 class="section-title">
              Known Communities
            </h2>
          </div>

          <button
            class="secondary"
            onclick="loadCommunities()"
          >
            Refresh
          </button>
        </div>

        <div
          id="communityListStatus"
          class="status-box"
        ></div>

        <div id="communityList"></div>
      </div>

    </div>

  </div>

  <script>
    const API_BASE = window.location.origin;

    const SESSION_KEY = "fivem_intel_api_key";
    const LOCAL_KEY = "fivem_intel_api_key_remembered";

    document.addEventListener("DOMContentLoaded", () => {
      restoreApiKey();
    });

    function restoreApiKey() {
      const remembered = localStorage.getItem(LOCAL_KEY);
      const session = sessionStorage.getItem(SESSION_KEY);

      const apiKeyInput = document.getElementById("apiKey");
      const rememberBox = document.getElementById("rememberApiKey");

      if (remembered) {
        apiKeyInput.value = remembered;
        rememberBox.checked = true;
      } else if (session) {
        apiKeyInput.value = session;
      }

      updateAuthStatus();
    }

    function handleApiKeyChange() {
      const apiKey = getApiKey();
      const remember = document.getElementById("rememberApiKey").checked;

      if (apiKey) {
        sessionStorage.setItem(SESSION_KEY, apiKey);

        if (remember) {
          localStorage.setItem(LOCAL_KEY, apiKey);
        }
      } else {
        sessionStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(LOCAL_KEY);
      }

      updateAuthStatus();
    }

    function handleRememberChange() {
      const apiKey = getApiKey();
      const remember = document.getElementById("rememberApiKey").checked;

      if (remember && apiKey) {
        localStorage.setItem(LOCAL_KEY, apiKey);
      } else {
        localStorage.removeItem(LOCAL_KEY);
      }

      updateAuthStatus();
    }

    function updateAuthStatus() {
      const status = document.getElementById("authStatus");

      if (getApiKey()) {
        status.innerHTML =
          '<span class="success">API key loaded</span>';
      } else {
        status.innerHTML =
          '<span class="muted">Not authenticated</span>';
      }
    }

    function getApiKey() {
      return document
        .getElementById("apiKey")
        .value
        .trim();
    }

    function showTab(tabId, button) {
      document
        .querySelectorAll(".tab")
        .forEach(tab => {
          tab.classList.remove("active");
        });

      document
        .querySelectorAll(".tab-button")
        .forEach(btn => {
          btn.classList.remove("active");
        });

      document
        .getElementById(tabId)
        .classList.add("active");

      button.classList.add("active");

      if (tabId === "communities") {
        loadSubjects();
        loadCommunities();
      }
    }

    async function apiRequest(url, options = {}) {
      const apiKey = getApiKey();

      if (!apiKey) {
        throw new Error("API key is required.");
      }

      options.headers = {
        ...(options.headers || {}),
        "x-api-key": apiKey
      };

      const response = await fetch(url, options);

      let data = null;

      try {
        data = await response.json();
      } catch {
        data = null;
      }

      if (response.status === 401) {
        throw new Error("Unauthorized. Check your API key.");
      }

      if (!response.ok) {
        const error = new Error(
          data?.message ||
          data?.error ||
          `Request failed with status ${response.status}`
        );

        error.status = response.status;
        error.data = data;

        throw error;
      }

      return data;
    }

    async function searchUser() {
      const discordId = document
        .getElementById("lookupDiscordId")
        .value
        .trim();

      const status =
        document.getElementById("lookupStatus");

      const results =
        document.getElementById("lookupResults");

      status.innerHTML = "";
      results.innerHTML = "";

      if (!getApiKey()) {
        status.innerHTML =
          '<div class="result-banner error-banner">API key is required.</div>';
        return;
      }

      if (!discordId) {
        status.innerHTML =
          '<div class="result-banner error-banner">Discord ID is required.</div>';
        return;
      }

      status.innerHTML =
        '<span class="muted">Searching...</span>';

      try {
        const response = await fetch(
          `${API_BASE}/api/v1/users/${encodeURIComponent(discordId)}/evidence`,
          {
            method: "GET",
            headers: {
              "x-api-key": getApiKey()
            }
          }
        );

        const data = await response.json();

        if (response.status === 401) {
          status.innerHTML =
            '<div class="result-banner error-banner">Unauthorized. Check your API key.</div>';
          return;
        }

        if (
          response.status === 404 ||
          data.found === false
        ) {
          status.innerHTML =
            '<div class="result-banner no-match">NO MATCH FOUND</div>';

          results.innerHTML = `
            <div class="card">
              <h2>${escapeHtml(discordId)}</h2>
              <p class="muted">
                No known community associations are stored for this Discord ID.
              </p>
            </div>
          `;

          return;
        }

        if (!response.ok) {
          status.innerHTML =
            `<div class="result-banner error-banner">
              ${escapeHtml(data.error || "Lookup failed")}
            </div>`;

          return;
        }

        status.innerHTML =
          `<div class="result-banner match-found">
            MATCH FOUND — ${data.evidenceCount} association record(s)
          </div>`;

        const wrapper =
          document.createElement("div");

        wrapper.className = "card";

        wrapper.innerHTML = `
          <h2>
            Discord User
          </h2>

          <p>
            <strong>ID:</strong>
            <code>${escapeHtml(data.discordId)}</code>

            <button
              class="copy-btn"
              onclick="copyText('${escapeHtml(data.discordId)}')"
            >
              Copy
            </button>
          </p>

          <p class="footer-note">
            Community membership alone is not proof that a user cheated.
          </p>
        `;

        for (const evidence of data.evidence) {
          const server = evidence.server;
          const subject = server?.subject;

          const match =
            document.createElement("div");

          match.className = "match";

          const roles =
            evidence.roleNames?.length
              ? evidence.roleNames
                  .map(
                    role =>
                      `<span class="badge">${escapeHtml(role)}</span>`
                  )
                  .join("")
              : '<span class="muted">None recorded</span>';

          const statusText =
            evidence.endedAt
              ? "Historical"
              : "Current / Last Known";

          match.innerHTML = `
            <h3>
              ${escapeHtml(server?.name || "Unknown Community")}
            </h3>

            <p>
              <strong>Product:</strong>
              ${escapeHtml(subject?.name || "Unknown")}
            </p>

            <p>
              <strong>Guild ID:</strong>

              <code>
                ${escapeHtml(server?.discordId || "Unknown")}
              </code>

              ${
                server?.discordId
                  ? `
                    <button
                      class="copy-btn"
                      onclick="copyText('${escapeHtml(server.discordId)}')"
                    >
                      Copy
                    </button>
                  `
                  : ""
              }
            </p>

            <p>
              <strong>Category:</strong>
              ${friendlyCategory(subject?.category)}
            </p>

            <p>
              <strong>Status:</strong>
              ${statusText}
            </p>

            <p>
              <strong>Confidence:</strong>
              ${escapeHtml(evidence.confidence || "Unknown")}
            </p>

            <p>
              <strong>First / Last Observed:</strong>
              ${formatDate(evidence.observedAt)}
            </p>

            ${
              evidence.endedAt
                ? `
                  <p>
                    <strong>Ended:</strong>
                    ${formatDate(evidence.endedAt)}
                  </p>
                `
                : ""
            }

            <p>
              <strong>Roles:</strong><br>
              ${roles}
            </p>
          `;

          wrapper.appendChild(match);
        }

        results.appendChild(wrapper);

      } catch (error) {
        status.innerHTML =
          `<div class="result-banner error-banner">
            ${escapeHtml(error.message)}
          </div>`;
      }
    }

    async function loadSubjects() {
      const select =
        document.getElementById("communitySubject");

      select.innerHTML =
        '<option value="">Loading...</option>';

      try {
        const subjects = await apiRequest(
          `${API_BASE}/api/v1/subjects`
        );

        select.innerHTML =
          '<option value="">Select product/community</option>';

        for (const subject of subjects) {
          const option =
            document.createElement("option");

          option.value = subject.id;

          option.textContent =
            `${subject.name} — ${friendlyCategory(subject.category)}`;

          select.appendChild(option);
        }

      } catch (error) {
        select.innerHTML =
          '<option value="">Could not load subjects</option>';
      }
    }

    async function loadCommunities() {
      const status =
        document.getElementById("communityListStatus");

      const list =
        document.getElementById("communityList");

      status.innerHTML =
        '<span class="muted">Loading...</span>';

      list.innerHTML = "";

      try {
        const servers = await apiRequest(
          `${API_BASE}/api/v1/servers`
        );

        if (!servers.length) {
          status.innerHTML =
            '<span class="muted">No communities stored.</span>';

          return;
        }

        status.innerHTML =
          `<span class="success">
            ${servers.length} known Discord community(s).
          </span>`;

        for (const server of servers) {
          const item =
            document.createElement("div");

          item.className =
            "community-card";

          item.innerHTML = `
            <div class="community-top">

              <div>
                <h3>
                  ${escapeHtml(server.name)}
                </h3>

                <p class="muted">
                  ${escapeHtml(server.subject?.name || "Unknown Product")}
                </p>
              </div>

              <div class="community-status">
                ${
                  server.active
                    ? '<span class="success">ACTIVE</span>'
                    : '<span class="warning">HISTORICAL</span>'
                }
              </div>

            </div>

            <p>
              <strong>Guild ID:</strong>

              <code>
                ${escapeHtml(server.discordId)}
              </code>

              <button
                class="copy-btn"
                onclick="copyText('${escapeHtml(server.discordId)}')"
              >
                Copy
              </button>
            </p>

            <p>
              <strong>Category:</strong>
              ${friendlyCategory(server.subject?.category)}
            </p>

            <p>
              <strong>Confidence:</strong>
              ${escapeHtml(server.confidence)}
            </p>

            ${
              server.sourceUrl
                ? `
                  <p>
                    <strong>Source:</strong>
                    ${escapeHtml(server.sourceUrl)}
                  </p>
                `
                : ""
            }
          `;

          list.appendChild(item);
        }

      } catch (error) {
        status.innerHTML =
          `<span class="error">
            ${escapeHtml(error.message)}
          </span>`;
      }
    }

    async function addCommunity() {
      const status =
        document.getElementById("communityStatus");

      status.innerHTML = "";

      if (!getApiKey()) {
        status.innerHTML =
          '<span class="error">API key is required.</span>';
        return;
      }

      const discordId =
        document
          .getElementById("communityDiscordId")
          .value
          .trim();

      const name =
        document
          .getElementById("communityName")
          .value
          .trim();

      const subjectId =
        document
          .getElementById("communitySubject")
          .value;

      if (!discordId) {
        status.innerHTML =
          '<span class="error">Discord Guild ID is required.</span>';
        return;
      }

      if (!name) {
        status.innerHTML =
          '<span class="error">Discord server name is required.</span>';
        return;
      }

      if (!subjectId) {
        status.innerHTML =
          '<span class="error">Select a product/community.</span>';
        return;
      }

      const body = {
        discordId,
        name,
        subjectId,

        confidence:
          document.getElementById("communityConfidence").value,

        active:
          document.getElementById("communityActive").value === "true"
      };

      const sourceUrl =
        document
          .getElementById("communitySourceUrl")
          .value
          .trim();

      if (sourceUrl) {
        body.sourceUrl = sourceUrl;
      }

      try {
        await apiRequest(
          `${API_BASE}/api/v1/servers`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body:
              JSON.stringify(body)
          }
        );

        status.innerHTML =
          '<span class="success">Community added successfully.</span>';

        document.getElementById(
          "communityDiscordId"
        ).value = "";

        document.getElementById(
          "communityName"
        ).value = "";

        document.getElementById(
          "communitySourceUrl"
        ).value = "";

        document.getElementById(
          "communitySubject"
        ).value = "";

        loadCommunities();

      } catch (error) {
        if (error.status === 409) {
          status.innerHTML =
            `<span class="warning">
              ${escapeHtml(error.message)}
            </span>`;

          return;
        }

        status.innerHTML =
          `<span class="error">
            ${escapeHtml(error.message)}
          </span>`;
      }
    }

    function friendlyCategory(value) {
      if (!value) {
        return "Unknown";
      }

      return String(value)
        .replaceAll("_", " ")
        .toLowerCase()
        .replace(/\b\w/g, char =>
          char.toUpperCase()
        );
    }

    function formatDate(value) {
      if (!value) {
        return "Unknown";
      }

      return new Date(value)
        .toLocaleString();
    }

    async function copyText(value) {
      try {
        await navigator.clipboard.writeText(value);
      } catch {
        console.warn("Clipboard write failed");
      }
    }

    function escapeHtml(value) {
      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
