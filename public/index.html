<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FiveM Intelligence Dashboard</title>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel2: #1f2937;
      --border: #374151;
      --text: #f9fafb;
      --muted: #9ca3af;
      --success: #86efac;
      --error: #fca5a5;
      --warning: #fde68a;
      --accent: #e5e7eb;
      --danger: #991b1b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(1150px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 60px;
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
    }

    .success {
      color: var(--success);
    }

    .error {
      color: var(--error);
    }

    .warning {
      color: var(--warning);
    }

    .card {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 0;
    }

    .user-box {
      text-align: right;
    }

    .role-badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #374151;
      font-size: 12px;
      font-weight: bold;
      margin-top: 5px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #4b5563;
      border-radius: 9px;
      background: var(--panel);
      color: white;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: white;
      color: #111827;
    }

    .secondary {
      background: #374151;
      color: white;
    }

    .danger {
      background: var(--danger);
      color: white;
    }

    .small-button {
      padding: 7px 10px;
      font-size: 12px;
    }

    .login-wrapper {
      max-width: 480px;
      margin: 80px auto;
    }

    .login-title {
      text-align: center;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .tab-button {
      background: var(--panel2);
      color: white;
      border: 1px solid var(--border);
    }

    .tab-button.active {
      background: white;
      color: #111827;
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
    }

    .status-box {
      margin-top: 14px;
    }

    .result-banner {
      padding: 13px 15px;
      border-radius: 10px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .match-found {
      background: #14532d;
    }

    .no-match {
      background: #374151;
    }

    .error-banner {
      background: #7f1d1d;
    }

    .match,
    .community-card,
    .staff-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 17px;
      margin-top: 14px;
    }

    .community-top,
    .staff-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .badge {
      display: inline-block;
      background: #374151;
      border-radius: 999px;
      padding: 5px 9px;
      margin-right: 5px;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .copy-btn {
      background: #374151;
      color: white;
      padding: 5px 8px;
      font-size: 12px;
      margin-left: 5px;
    }

    code {
      background: #0b1120;
      padding: 3px 6px;
      border-radius: 5px;
    }

    .staff-actions {
      display: grid;
      grid-template-columns: 180px 140px auto;
      gap: 8px;
      margin-top: 15px;
      align-items: center;
    }

    .staff-actions select {
      margin: 0;
    }

    .footer-note {
      color: var(--muted);
      font-size: 13px;
      margin-top: 12px;
    }

    @media (max-width: 700px) {
      .page-header {
        display: block;
      }

      .user-box {
        text-align: left;
        margin-top: 15px;
      }

      .staff-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="loginScreen" class="login-wrapper">

    <h1 class="login-title">FiveM Intelligence</h1>

    <p class="login-subtitle">
      Authorized Staff Access
    </p>

    <div class="card">

      <label for="loginUsername">
        Username
      </label>

      <input
        id="loginUsername"
        autocomplete="username"
        onkeydown="if(event.key === 'Enter') login()"
      />

      <label for="loginPassword">
        Password
      </label>

      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        onkeydown="if(event.key === 'Enter') login()"
      />

      <button
        class="primary"
        onclick="login()"
      >
        Sign In
      </button>

      <div
        id="loginStatus"
        class="status-box"
      ></div>

    </div>
  </div>


  <!-- DASHBOARD -->

  <div
    id="dashboard"
    class="container hidden"
  >

    <div class="page-header">

      <div>
        <h1>FiveM Intelligence Dashboard</h1>

        <p class="subtitle">
          Discord community intelligence and staff lookup.
        </p>
      </div>

      <div class="user-box">

        <strong id="currentUsername"></strong>

        <br>

        <span
          id="currentRole"
          class="role-badge"
        ></span>

        <br><br>

        <button
          class="secondary small-button"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

    </div>


    <div
      id="tabs"
      class="tabs"
    >

      <button
        class="tab-button active"
        onclick="showTab('lookup', this)"
      >
        User Lookup
      </button>

      <button
        id="communitiesTabButton"
        class="tab-button hidden"
        onclick="showTab('communities', this)"
      >
        Manage Communities
      </button>

      <button
        id="staffTabButton"
        class="tab-button hidden"
        onclick="showTab('staff', this)"
      >
        Manage Staff
      </button>

    </div>


    <!-- LOOKUP -->

    <div
      id="lookup"
      class="tab active"
    >

      <div class="card">

        <h2>User Lookup</h2>

        <label for="lookupDiscordId">
          Discord User ID
        </label>

        <input
          id="lookupDiscordId"
          placeholder="Example: 198165163172429824"
          onkeydown="if(event.key === 'Enter') searchUser()"
        />

        <button
          class="primary"
          onclick="searchUser()"
        >
          Search
        </button>

        <div
          id="lookupStatus"
          class="status-box"
        ></div>

      </div>

      <div id="lookupResults"></div>

    </div>


    <!-- COMMUNITIES -->

    <div
      id="communities"
      class="tab"
    >

      <div
        id="addCommunityCard"
        class="card hidden"
      >

        <h2>Add Community</h2>

        <div class="grid">

          <div>

            <label>
              Product / Community
            </label>

            <select id="communitySubject">
              <option value="">
                Select product/community
              </option>
            </select>

          </div>

          <div>

            <label>
              Discord Guild ID
            </label>

            <input
              id="communityDiscordId"
              placeholder="1136029776080023563"
            />

          </div>

          <div>

            <label>
              Discord Server Name
            </label>

            <input
              id="communityName"
              placeholder="Eulen"
            />

          </div>

          <div>

            <label>
              Confidence
            </label>

            <select id="communityConfidence">
              <option>UNVERIFIED</option>
              <option>LOW</option>
              <option>MEDIUM</option>
              <option>HIGH</option>
              <option selected>CONFIRMED</option>
            </select>

          </div>

          <div>

            <label>
              Status
            </label>

            <select id="communityActive">
              <option value="true">Active</option>
              <option value="false">Inactive / Historical</option>
            </select>

          </div>

          <div>

            <label>
              Source URL
            </label>

            <input
              id="communitySourceUrl"
              placeholder="Optional"
            />

          </div>

        </div>

        <button
          class="primary"
          onclick="addCommunity()"
        >
          Add Community
        </button>

        <div
          id="communityStatus"
          class="status-box"
        ></div>

      </div>


      <div class="card">

        <div class="community-top">

          <h2>
            Known Communities
          </h2>

          <button
            class="secondary small-button"
            onclick="loadCommunities()"
          >
            Refresh
          </button>

        </div>

        <div
          id="communityListStatus"
          class="status-box"
        ></div>

        <div id="communityList"></div>

      </div>

    </div>


    <!-- STAFF -->

    <div
      id="staff"
      class="tab"
    >

      <div class="card">

        <h2>Create Staff Account</h2>

        <div class="grid">

          <div>

            <label>
              Username
            </label>

            <input id="newStaffUsername" />

          </div>

          <div>

            <label>
              Temporary Password
            </label>

            <input
              id="newStaffPassword"
              type="password"
              placeholder="Minimum 12 characters"
            />

          </div>

          <div>

            <label>
              Role
            </label>

            <select id="newStaffRole">

              <option value="READ_ONLY">
                Read Only
              </option>

              <option value="ANALYST">
                Analyst
              </option>

              <option value="ADMIN">
                Admin
              </option>

            </select>

          </div>

        </div>

        <button
          class="primary"
          onclick="createStaff()"
        >
          Create Account
        </button>

        <div
          id="createStaffStatus"
          class="status-box"
        ></div>

      </div>


      <div class="card">

        <div class="staff-top">

          <h2>Staff Accounts</h2>

          <button
            class="secondary small-button"
            onclick="loadStaff()"
          >
            Refresh
          </button>

        </div>

        <div
          id="staffListStatus"
          class="status-box"
        ></div>

        <div id="staffList"></div>

      </div>

    </div>

  </div>


  <script>

    const API_BASE =
      window.location.origin;

    let currentUser = null;


    document.addEventListener(
      "DOMContentLoaded",
      checkSession
    );


    async function apiRequest(
      url,
      options = {}
    ) {

      options.credentials =
        "same-origin";

      const response =
        await fetch(
          url,
          options
        );

      let data = null;

      try {
        data =
          await response.json();
      } catch {
        data = null;
      }

      if (!response.ok) {

        const error =
          new Error(
            data?.message ||
            data?.error ||
            `Request failed (${response.status})`
          );

        error.status =
          response.status;

        error.data =
          data;

        throw error;
      }

      return data;
    }


    async function checkSession() {

      try {

        const data =
          await apiRequest(
            `${API_BASE}/api/v1/auth/me`
          );

        currentUser =
          data.user;

        showDashboard();

      } catch {

        showLogin();

      }
    }


    async function login() {

      const username =
        document
          .getElementById(
            "loginUsername"
          )
          .value
          .trim();

      const password =
        document
          .getElementById(
            "loginPassword"
          )
          .value;

      const status =
        document.getElementById(
          "loginStatus"
        );

      status.innerHTML = "";

      if (!username || !password) {

        status.innerHTML =
          '<span class="error">Username and password are required.</span>';

        return;
      }

      try {

        const data =
          await apiRequest(
            `${API_BASE}/api/v1/auth/login`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  username,
                  password
                })
            }
          );

        currentUser =
          data.user;

        document.getElementById(
          "loginPassword"
        ).value = "";

        showDashboard();

      } catch (error) {

        status.innerHTML =
          `<span class="error">
            ${escapeHtml(error.message)}
          </span>`;
      }
    }


    async function logout() {

      try {

        await apiRequest(
          `${API_BASE}/api/v1/auth/logout`,
          {
            method: "POST"
          }
        );

      } catch {}

      currentUser = null;

      showLogin();
    }


    function showLogin() {

      document
        .getElementById("dashboard")
        .classList
        .add("hidden");

      document
        .getElementById("loginScreen")
        .classList
        .remove("hidden");
    }


    function showDashboard() {

      document
        .getElementById("loginScreen")
        .classList
        .add("hidden");

      document
        .getElementById("dashboard")
        .classList
        .remove("hidden");

      document.getElementById(
        "currentUsername"
      ).textContent =
        currentUser.username;

      document.getElementById(
        "currentRole"
      ).textContent =
        friendlyRole(
          currentUser.role
        );

      configureRoleAccess();
    }


    function configureRoleAccess() {

      const communitiesButton =
        document.getElementById(
          "communitiesTabButton"
        );

      const staffButton =
        document.getElementById(
          "staffTabButton"
        );

      const addCommunityCard =
        document.getElementById(
          "addCommunityCard"
        );

      communitiesButton
        .classList
        .add("hidden");

      staffButton
        .classList
        .add("hidden");

      addCommunityCard
        .classList
        .add("hidden");


      if (
        currentUser.role ===
        "ANALYST"
      ) {

        communitiesButton
          .classList
          .remove("hidden");
      }


      if (
        currentUser.role ===
        "ADMIN"
      ) {

        communitiesButton
          .classList
          .remove("hidden");

        staffButton
          .classList
          .remove("hidden");

        addCommunityCard
          .classList
          .remove("hidden");
      }
    }


    function showTab(
      tabId,
      button
    ) {

      document
        .querySelectorAll(".tab")
        .forEach(tab => {

          tab.classList.remove(
            "active"
          );
        });


      document
        .querySelectorAll(
          ".tab-button"
        )
        .forEach(btn => {

          btn.classList.remove(
            "active"
          );
        });


      document
        .getElementById(tabId)
        .classList
        .add("active");

      button.classList.add(
        "active"
      );


      if (
        tabId ===
        "communities"
      ) {

        loadCommunities();

        if (
          currentUser.role ===
          "ADMIN"
        ) {

          loadSubjects();
        }
      }


      if (
        tabId ===
        "staff"
      ) {

        loadStaff();
      }
    }


    async function searchUser() {

      const discordId =
        document
          .getElementById(
            "lookupDiscordId"
          )
          .value
          .trim();

      const status =
        document.getElementById(
          "lookupStatus"
        );

      const results =
        document.getElementById(
          "lookupResults"
        );

      status.innerHTML = "";

      results.innerHTML = "";


      if (!discordId) {

        status.innerHTML =
          '<div class="result-banner error-banner">Discord ID is required.</div>';

        return;
      }


      try {

        const response =
          await fetch(
            `${API_BASE}/api/v1/users/${encodeURIComponent(discordId)}/evidence`,
            {
              credentials:
                "same-origin"
            }
          );

        const data =
          await response.json();


        if (
          response.status === 404 ||
          data.found === false
        ) {

          status.innerHTML =
            '<div class="result-banner no-match">NO MATCH FOUND</div>';

          return;
        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Lookup failed"
          );
        }


        status.innerHTML =
          `<div class="result-banner match-found">
            MATCH FOUND — ${data.evidenceCount} association(s)
          </div>`;


        const wrapper =
          document.createElement(
            "div"
          );

        wrapper.className =
          "card";


        wrapper.innerHTML = `
          <h2>Discord User</h2>

          <p>
            <strong>ID:</strong>

            <code>
              ${escapeHtml(data.discordId)}
            </code>

            <button
              class="copy-btn"
              onclick="copyText('${escapeHtml(data.discordId)}')"
            >
              Copy
            </button>
          </p>

          <p class="footer-note">
            Community membership alone is not proof that a user cheated.
          </p>
        `;


        for (
          const evidence
          of data.evidence
        ) {

          const server =
            evidence.server;

          const subject =
            server?.subject;


          const roles =
            evidence.roleNames?.length

              ? evidence.roleNames
                  .map(
                    role =>
                      `<span class="badge">${escapeHtml(role)}</span>`
                  )
                  .join("")

              : '<span class="muted">None recorded</span>';


          const match =
            document.createElement(
              "div"
            );

          match.className =
            "match";


          match.innerHTML = `
            <h3>
              ${escapeHtml(server?.name || "Unknown Community")}
            </h3>

            <p>
              <strong>Product:</strong>
              ${escapeHtml(subject?.name || "Unknown")}
            </p>

            <p>
              <strong>Guild ID:</strong>

              <code>
                ${escapeHtml(server?.discordId || "Unknown")}
              </code>

              ${
                server?.discordId
                  ? `
                    <button
                      class="copy-btn"
                      onclick="copyText('${escapeHtml(server.discordId)}')"
                    >
                      Copy
                    </button>
                  `
                  : ""
              }
            </p>

            <p>
              <strong>Category:</strong>
              ${friendlyCategory(subject?.category)}
            </p>

            <p>
              <strong>Confidence:</strong>
              ${escapeHtml(evidence.confidence || "Unknown")}
            </p>

            <p>
              <strong>Observed:</strong>
              ${formatDate(evidence.observedAt)}
            </p>

            <p>
              <strong>Roles:</strong><br>
              ${roles}
            </p>
          `;

          wrapper.appendChild(
            match
          );
        }


        results.appendChild(
          wrapper
        );

      } catch (error) {

        status.innerHTML =
          `<div class="result-banner error-banner">
            ${escapeHtml(error.message)}
          </div>`;
      }
    }


    async function loadSubjects() {

      const select =
        document.getElementById(
          "communitySubject"
        );

      select.innerHTML =
        '<option value="">Loading...</option>';


      try {

        const subjects =
          await apiRequest(
            `${API_BASE}/api/v1/subjects`
          );

        select.innerHTML =
          '<option value="">Select product/community</option>';


        for (
          const subject
          of subjects
        ) {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            subject.id;

          option.textContent =
            `${subject.name} — ${friendlyCategory(subject.category)}`;

          select.appendChild(
            option
          );
        }

      } catch {

        select.innerHTML =
          '<option value="">Could not load products</option>';
      }
    }


    async function loadCommunities() {

      const status =
        document.getElementById(
          "communityListStatus"
        );

      const list =
        document.getElementById(
          "communityList"
        );

      status.innerHTML =
        '<span class="muted">Loading...</span>';

      list.innerHTML = "";


      try {

        const servers =
          await apiRequest(
            `${API_BASE}/api/v1/servers`
          );


        status.innerHTML =
          `<span class="success">
            ${servers.length} known community(s)
          </span>`;


        for (
          const server
          of servers
        ) {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "community-card";


          item.innerHTML = `
            <div class="community-top">

              <div>
                <h3>
                  ${escapeHtml(server.name)}
                </h3>

                <p class="muted">
                  ${escapeHtml(server.subject?.name || "Unknown Product")}
                </p>
              </div>

              <div>
                ${
                  server.active

                    ? '<span class="success"><strong>ACTIVE</strong></span>'

                    : '<span class="warning"><strong>HISTORICAL</strong></span>'
                }
              </div>

            </div>

            <p>
              <strong>Guild ID:</strong>

              <code>
                ${escapeHtml(server.discordId)}
              </code>

              <button
                class="copy-btn"
                onclick="copyText('${escapeHtml(server.discordId)}')"
              >
                Copy
              </button>
            </p>

            <p>
              <strong>Category:</strong>
              ${friendlyCategory(server.subject?.category)}
            </p>

            <p>
              <strong>Confidence:</strong>
              ${escapeHtml(server.confidence)}
            </p>
          `;


          list.appendChild(
            item
          );
        }

      } catch (error) {

        status.innerHTML =
          `<span class="error">
            ${escapeHtml(error.message)}
          </span>`;
      }
    }


    async function addCommunity() {

      const status =
        document.getElementById(
          "communityStatus"
        );


      const discordId =
        document
          .getElementById(
            "communityDiscordId"
          )
          .value
          .trim();


      const name =
        document
          .getElementById(
            "communityName"
          )
          .value
          .trim();


      const subjectId =
        document
          .getElementById(
            "communitySubject"
          )
          .value;


      if (
        !discordId ||
        !name ||
        !subjectId
      ) {

        status.innerHTML =
          '<span class="error">Product, Guild ID, and server name are required.</span>';

        return;
      }


      const body = {
        discordId,
        name,
        subjectId,

        confidence:
          document.getElementById(
            "communityConfidence"
          ).value,

        active:
          document.getElementById(
            "communityActive"
          ).value === "true"
      };


      const sourceUrl =
        document
          .getElementById(
            "communitySourceUrl"
          )
          .value
          .trim();


      if (sourceUrl) {
        body.sourceUrl =
          sourceUrl;
      }


      try {

        await apiRequest(
          `${API_BASE}/api/v1/servers`,
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(body)
          }
        );


        status.innerHTML =
          '<span class="success">Community added successfully.</span>';

        loadCommunities();

      } catch (error) {

        status.innerHTML =
          `<span class="${
            error.status === 409
              ? "warning"
              : "error"
          }">
            ${escapeHtml(error.message)}
          </span>`;
      }
    }


    async function loadStaff() {

      const status =
        document.getElementById(
          "staffListStatus"
        );

      const list =
        document.getElementById(
          "staffList"
        );

      status.innerHTML =
        '<span class="muted">Loading...</span>';

      list.innerHTML = "";


      try {

        const staff =
          await apiRequest(
            `${API_BASE}/api/v1/staff`
          );


        status.innerHTML =
          `<span class="success">
            ${staff.length} staff account(s)
          </span>`;


        for (
          const user
          of staff
        ) {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "staff-card";


          item.innerHTML = `
            <div class="staff-top">

              <div>
                <h3>
                  ${escapeHtml(user.username)}
                </h3>

                <span class="role-badge">
                  ${friendlyRole(user.role)}
                </span>
              </div>

              <div>
                ${
                  user.active

                    ? '<span class="success"><strong>ACTIVE</strong></span>'

                    : '<span class="error"><strong>DISABLED</strong></span>'
                }
              </div>

            </div>

            <div class="staff-actions">

              <select id="role-${user.id}">

                <option
                  value="READ_ONLY"
                  ${
                    user.role === "READ_ONLY"
                      ? "selected"
                      : ""
                  }
                >
                  Read Only
                </option>

                <option
                  value="ANALYST"
                  ${
                    user.role === "ANALYST"
                      ? "selected"
                      : ""
                  }
                >
                  Analyst
                </option>

                <option
                  value="ADMIN"
                  ${
                    user.role === "ADMIN"
                      ? "selected"
                      : ""
                  }
                >
                  Admin
                </option>

              </select>

              <select id="active-${user.id}">

                <option
                  value="true"
                  ${
                    user.active
                      ? "selected"
                      : ""
                  }
                >
                  Active
                </option>

                <option
                  value="false"
                  ${
                    !user.active
                      ? "selected"
                      : ""
                  }
                >
                  Disabled
                </option>

              </select>

              <button
                class="secondary small-button"
                onclick="updateStaff('${user.id}')"
              >
                Save Changes
              </button>

            </div>
          `;


          list.appendChild(
            item
          );
        }

      } catch (error) {

        status.innerHTML =
          `<span class="error">
            ${escapeHtml(error.message)}
          </span>`;
      }
    }


    async function createStaff() {

      const username =
        document
          .getElementById(
            "newStaffUsername"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "newStaffPassword"
          )
          .value;


      const role =
        document
          .getElementById(
            "newStaffRole"
          )
          .value;


      const status =
        document.getElementById(
          "createStaffStatus"
        );


      if (
        !username ||
        !password
      ) {

        status.innerHTML =
          '<span class="error">Username and password are required.</span>';

        return;
      }


      try {

        await apiRequest(
          `${API_BASE}/api/v1/staff`,
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                username,
                password,
                role
              })
          }
        );


        status.innerHTML =
          '<span class="success">Staff account created.</span>';


        document.getElementById(
          "newStaffUsername"
        ).value = "";


        document.getElementById(
          "newStaffPassword"
        ).value = "";


        loadStaff();

      } catch (error) {

        status.innerHTML =
          `<span class="error">
            ${escapeHtml(error.message)}
          </span>`;
      }
    }


    async function updateStaff(
      id
    ) {

      const role =
        document.getElementById(
          `role-${id}`
        ).value;


      const active =
        document.getElementById(
          `active-${id}`
        ).value === "true";


      try {

        await apiRequest(
          `${API_BASE}/api/v1/staff/${id}`,
          {
            method:
              "PATCH",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                role,
                active
              })
          }
        );


        loadStaff();

      } catch (error) {

        alert(
          error.message
        );
      }
    }


    function friendlyRole(
      value
    ) {

      const map = {
        ADMIN:
          "Admin",

        ANALYST:
          "Analyst",

        READ_ONLY:
          "Read Only"
      };

      return map[value] ||
        value;
    }


    function friendlyCategory(
      value
    ) {

      if (!value) {
        return "Unknown";
      }

      return String(value)
        .replaceAll("_", " ")
        .toLowerCase()
        .replace(
          /\b\w/g,
          char =>
            char.toUpperCase()
        );
    }


    function formatDate(
      value
    ) {

      if (!value) {
        return "Unknown";
      }

      return new Date(
        value
      ).toLocaleString();
    }


    async function copyText(
      value
    ) {

      try {

        await navigator
          .clipboard
          .writeText(value);

      } catch {}
    }


    function escapeHtml(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";
      }


      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );
    }

  </script>

</body>
</html>
