<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FiveM Intelligence Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f3f4f6;
      margin: 0;
      padding: 30px 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 24px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-button {
      background: #1f2937;
      color: white;
      border: 1px solid #374151;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .tab-button.active {
      background: #374151;
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }

    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .match {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 16px;
      margin-top: 12px;
    }

    .community {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 16px;
      margin-top: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      margin-bottom: 14px;
      border: 1px solid #4b5563;
      border-radius: 8px;
      background: #111827;
      color: white;
    }

    button {
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: white;
      color: black;
    }

    .muted {
      color: #9ca3af;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #374151;
      margin-right: 6px;
      margin-bottom: 4px;
      font-size: 13px;
    }

    code {
      background: #0f172a;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .section-title {
      margin-bottom: 14px;
    }

    .disclaimer {
      margin-top: 10px;
      color: #9ca3af;
      font-size: 14px;
    }

    .small {
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>FiveM Intelligence Dashboard</h1>

    <div class="subtitle">
      Search Discord IDs against stored cheating and leaking community associations.
    </div>

    <div class="card">
      <label for="apiKey">API Key</label>
      <input
        type="password"
        id="apiKey"
        placeholder="Enter API key"
      />
    </div>

    <div class="tabs">
      <button
        class="tab-button active"
        onclick="showTab('lookup', this)"
      >
        User Lookup
      </button>

      <button
        class="tab-button"
        onclick="showTab('communities', this)"
      >
        Manage Communities
      </button>
    </div>

    <!-- USER LOOKUP -->

    <div id="lookup" class="tab active">

      <div class="card">
        <h2 class="section-title">User Lookup</h2>

        <label for="lookupDiscordId">Discord User ID</label>

        <input
          type="text"
          id="lookupDiscordId"
          placeholder="Example: 198165163172429824"
        />

        <button
          class="primary"
          onclick="searchUser()"
        >
          Search
        </button>

        <div
          id="lookupStatus"
          style="margin-top:16px;"
        ></div>

      </div>

      <div id="lookupResults"></div>

    </div>

    <!-- MANAGE COMMUNITIES -->

    <div id="communities" class="tab">

      <div class="card">
        <h2 class="section-title">
          Add Discord Community
        </h2>

        <label for="communitySubject">
          Product / Community
        </label>

        <select id="communitySubject">
          <option value="">
            Load subjects first
          </option>
        </select>

        <label for="communityDiscordId">
          Discord Guild ID
        </label>

        <input
          id="communityDiscordId"
          type="text"
          placeholder="Example: 1136029776080023563"
        />

        <label for="communityName">
          Discord Server Name
        </label>

        <input
          id="communityName"
          type="text"
          placeholder="Example: Eulen"
        />

        <label for="communityConfidence">
          Confidence
        </label>

        <select id="communityConfidence">
          <option>UNVERIFIED</option>
          <option>LOW</option>
          <option>MEDIUM</option>
          <option>HIGH</option>
          <option selected>CONFIRMED</option>
        </select>

        <label for="communitySourceUrl">
          Source URL (optional)
        </label>

        <input
          id="communitySourceUrl"
          type="text"
          placeholder="Public source confirming the community"
        />

        <label for="communityActive">
          Status
        </label>

        <select id="communityActive">
          <option value="true">Active</option>
          <option value="false">Inactive / Historical</option>
        </select>

        <button
          class="primary"
          onclick="addCommunity()"
        >
          Add Community
        </button>

        <div
          id="communityStatus"
          style="margin-top:16px;"
        ></div>
      </div>

      <div class="card">
        <h2 class="section-title">
          Known Communities
        </h2>

        <button
          class="primary"
          onclick="loadCommunities()"
        >
          Refresh List
        </button>

        <div
          id="communityListStatus"
          style="margin-top:16px;"
        ></div>

        <div id="communityList"></div>
      </div>

    </div>

  </div>

  <script>
    const API_BASE = window.location.origin;

    function getApiKey() {
      return document
        .getElementById("apiKey")
        .value
        .trim();
    }

    function showTab(tabId, button) {

      document
        .querySelectorAll(".tab")
        .forEach(tab => {
          tab.classList.remove("active");
        });

      document
        .querySelectorAll(".tab-button")
        .forEach(btn => {
          btn.classList.remove("active");
        });

      document
        .getElementById(tabId)
        .classList.add("active");

      button.classList.add("active");

      if (tabId === "communities") {
        loadSubjects();
        loadCommunities();
      }
    }

    async function apiRequest(url, options = {}) {

      const apiKey = getApiKey();

      if (!apiKey) {
        throw new Error("API key is required.");
      }

      options.headers = {
        ...(options.headers || {}),
        "x-api-key": apiKey
      };

      const response = await fetch(url, options);

      let data = null;

      try {
        data = await response.json();
      } catch {
        data = null;
      }

      if (response.status === 401) {
        throw new Error("Unauthorized. Check your API key.");
      }

      if (!response.ok) {
        throw new Error(
          data?.error ||
          `Request failed with status ${response.status}`
        );
      }

      return data;
    }

    async function searchUser() {

      const discordId = document
        .getElementById("lookupDiscordId")
        .value
        .trim();

      const status =
        document.getElementById("lookupStatus");

      const results =
        document.getElementById("lookupResults");

      status.innerHTML = "";
      results.innerHTML = "";

      if (!discordId) {
        status.innerHTML =
          '<span class="error">Discord ID is required.</span>';
        return;
      }

      status.innerHTML =
        '<span class="muted">Searching...</span>';

      try {

        const response = await fetch(
          `${API_BASE}/api/v1/users/${encodeURIComponent(discordId)}/evidence`,
          {
            method: "GET",
            headers: {
              "x-api-key": getApiKey()
            }
          }
        );

        const data = await response.json();

        if (response.status === 401) {
          status.innerHTML =
            '<span class="error">Unauthorized. Check your API key.</span>';
          return;
        }

        if (
          response.status === 404 ||
          data.found === false
        ) {
          status.innerHTML =
            '<span class="muted">No known community associations found.</span>';
          return;
        }

        if (!response.ok) {
          status.innerHTML =
            `<span class="error">${escapeHtml(
              data.error || "Lookup failed"
            )}</span>`;
          return;
        }

        status.innerHTML =
          `<span class="success">
            ${data.evidenceCount} association record(s) found.
          </span>`;

        const wrapper =
          document.createElement("div");

        wrapper.className = "card";

        wrapper.innerHTML = `
          <h2>
            Discord ID:
            ${escapeHtml(data.discordId)}
          </h2>

          <p class="disclaimer">
            Community membership alone is not proof that a user cheated.
          </p>
        `;

        for (const evidence of data.evidence) {

          const server = evidence.server;
          const subject = server?.subject;

          const match =
            document.createElement("div");

          match.className = "match";

          const roles =
            evidence.roleNames?.length
              ? evidence.roleNames
                  .map(
                    role =>
                      `<span class="badge">
                        ${escapeHtml(role)}
                      </span>`
                  )
                  .join("")
              : '<span class="muted">None recorded</span>';

          const statusText =
            evidence.endedAt
              ? "Historical"
              : "Current / Last Known";

          match.innerHTML = `
            <h3>
              ${escapeHtml(
                server?.name || "Unknown Community"
              )}
            </h3>

            <p>
              <strong>Product:</strong>
              ${escapeHtml(
                subject?.name || "Unknown"
              )}
            </p>

            <p>
              <strong>Guild ID:</strong>
              <code>
                ${escapeHtml(
                  server?.discordId || "Unknown"
                )}
              </code>
            </p>

            <p>
              <strong>Category:</strong>
              ${friendlyCategory(
                subject?.category
              )}
            </p>

            <p>
              <strong>Status:</strong>
              ${statusText}
            </p>

            <p>
              <strong>Confidence:</strong>
              ${escapeHtml(
                evidence.confidence || "Unknown"
              )}
            </p>

            <p>
              <strong>Observed:</strong>
              ${formatDate(
                evidence.observedAt
              )}
            </p>

            ${
              evidence.endedAt
                ? `
                  <p>
                    <strong>Last Seen:</strong>
                    ${formatDate(
                      evidence.endedAt
                    )}
                  </p>
                `
                : ""
            }

            <p>
              <strong>Roles:</strong><br>
              ${roles}
            </p>
          `;

          wrapper.appendChild(match);
        }

        results.appendChild(wrapper);

      } catch (error) {

        status.innerHTML =
          `<span class="error">
            ${escapeHtml(error.message)}
          </span>`;
      }
    }

    async function loadSubjects() {

      const select =
        document.getElementById(
          "communitySubject"
        );

      select.innerHTML =
        '<option value="">Loading...</option>';

      try {

        const subjects = await apiRequest(
          `${API_BASE}/api/v1/subjects`
        );

        select.innerHTML =
          '<option value="">Select product/community</option>';

        for (const subject of subjects) {

          const option =
            document.createElement("option");

          option.value = subject.id;

          option.textContent =
            `${subject.name} — ${friendlyCategory(
              subject.category
            )}`;

          select.appendChild(option);
        }

      } catch (error) {

        select.innerHTML =
          '<option value="">Could not load subjects</option>';
      }
    }

    async function loadCommunities() {

      const status =
        document.getElementById(
          "communityListStatus"
        );

      const list =
        document.getElementById(
          "communityList"
        );

      status.innerHTML =
        '<span class="muted">Loading...</span>';

      list.innerHTML = "";

      try {

        const servers = await apiRequest(
          `${API_BASE}/api/v1/servers`
        );

        if (!servers.length) {

          status.innerHTML =
            '<span class="muted">No communities stored.</span>';

          return;
        }

        status.innerHTML =
          `<span class="success">
            ${servers.length} known Discord community(s).
          </span>`;

        for (const server of servers) {

          const item =
            document.createElement("div");

          item.className = "community";

          item.innerHTML = `
            <h3>
              ${escapeHtml(server.name)}
            </h3>

            <p>
              <strong>Product:</strong>
              ${escapeHtml(
                server.subject?.name || "Unknown"
              )}
            </p>

            <p>
              <strong>Guild ID:</strong>
              <code>
                ${escapeHtml(
                  server.discordId
                )}
              </code>
            </p>

            <p>
              <strong>Category:</strong>
              ${friendlyCategory(
                server.subject?.category
              )}
            </p>

            <p>
              <strong>Confidence:</strong>
              ${escapeHtml(
                server.confidence
              )}
            </p>

            <p>
              <strong>Status:</strong>
              ${
                server.active
                  ? "Active"
                  : "Inactive / Historical"
              }
            </p>

            ${
              server.sourceUrl
                ? `
                  <p class="small">
                    <strong>Source:</strong>
                    ${escapeHtml(
                      server.sourceUrl
                    )}
                  </p>
                `
                : ""
            }
          `;

          list.appendChild(item);
        }

      } catch (error) {

        status.innerHTML =
          `<span class="error">
            ${escapeHtml(error.message)}
          </span>`;
      }
    }

    async function addCommunity() {

      const status =
        document.getElementById(
          "communityStatus"
        );

      status.innerHTML = "";

      const discordId =
        document
          .getElementById(
            "communityDiscordId"
          )
          .value
          .trim();

      const name =
        document
          .getElementById(
            "communityName"
          )
          .value
          .trim();

      const subjectId =
        document
          .getElementById(
            "communitySubject"
          )
          .value;

      if (!discordId) {
        status.innerHTML =
          '<span class="error">Discord Guild ID is required.</span>';
        return;
      }

      if (!name) {
        status.innerHTML =
          '<span class="error">Server name is required.</span>';
        return;
      }

      if (!subjectId) {
        status.innerHTML =
          '<span class="error">Select a product/community.</span>';
        return;
      }

      const body = {
        discordId,
        name,
        subjectId,

        confidence:
          document.getElementById(
            "communityConfidence"
          ).value,

        active:
          document.getElementById(
            "communityActive"
          ).value === "true"
      };

      const sourceUrl =
        document
          .getElementById(
            "communitySourceUrl"
          )
          .value
          .trim();

      if (sourceUrl) {
        body.sourceUrl = sourceUrl;
      }

      try {

        await apiRequest(
          `${API_BASE}/api/v1/servers`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(body)
          }
        );

        status.innerHTML =
          '<span class="success">Community added successfully.</span>';

        document.getElementById(
          "communityDiscordId"
        ).value = "";

        document.getElementById(
          "communityName"
        ).value = "";

        document.getElementById(
          "communitySourceUrl"
        ).value = "";

        loadCommunities();

      } catch (error) {

        status.innerHTML =
          `<span class="error">
            ${escapeHtml(error.message)}
          </span>`;
      }
    }

    function friendlyCategory(value) {

      if (!value) return "Unknown";

      return String(value)
        .replaceAll("_", " ")
        .toLowerCase()
        .replace(/\b\w/g, char =>
          char.toUpperCase()
        );
    }

    function formatDate(value) {

      if (!value) return "Unknown";

      return new Date(value)
        .toLocaleString();
    }

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

  </script>

</body>
</html>
